project:
  name: cherry-tomato-vision-sorting
  execution_mode: offline_video
runtime:
  device: auto
  synchronize_cuda_for_timing: true
paths:
  input_video: inputs/input_video.mp4
  input_videos: inputs
  output_video: outputs/output_video.mp4
  output_dir: outputs
  output_json: outputs/tomatoes.json
  benchmark_json: outputs/benchmark.json
  size_measurements_csv: outputs/size_measurements.csv
batch:
  video_extensions: [.mp4, .avi, .mov, .mkv, .m4v, .webm]
  recursive: false
video:
  codec: mp4v
  fallback_fps: null
  max_frames: null
detector:
  type: yolo11n
  weights_path: models/detector/yolo_tomato_detector.pt
  confidence_threshold: 0.1
  iou_threshold: 0.45
  input_size: 416
  tomato_class_id: 0
  max_detections: 100
tracker:
  type: bytetrack
  high_threshold: 0.5
  low_threshold: 0.1
  new_track_threshold: 0.6
  match_threshold: 0.8
  lost_track_buffer: 30
  fuse_score: true
track_management:
  save_bbox_history: true
  tracking_zone: {x_min_ratio: 0.0, x_max_ratio: 1.0, y_min_ratio: 0.3333333333, y_max_ratio: 1.0}
classifier:
  type: shufflenet_v2_x1_0_multihead
  weights_path: models/classifier/shufflenet_multitask.pt
  thresholds_path: models/classifier/shufflenet_multitask_thresholds.json
  input_size: 256
  feature_dim: 1024
  head_hidden_dim: 128
  dropout: 0.25
  normalize_inside_model: true
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  health:
    threshold: 0.375
  calyx:
    threshold: 0.77
classification_policy:
  mode: lower_zone_asymmetric_temporal_voting
  sample_stride_frames: 3
  min_samples_for_healthy: 10
  zone: {x_min_ratio: 0.0, x_max_ratio: 1.0, y_min_ratio: 0.4114583333, y_max_ratio: 1.0}
  unhealthy_evidence: {consecutive_positive_samples: 3, total_positive_samples: 5, top_k: 3, top_k_mean_threshold: 0.60}
crop:
  # Add 10% of the ROI width and height on each side before clipping to the frame.
  padding_ratio: 0.10
  allow_padding_clipping: true
quality_gate:
  # Disabled in the default temporal pipeline; retained for optional input filtering.
  enabled: false
  min_detection_confidence: 0.0
  min_bbox_width_px: 0
  min_bbox_height_px: 0
  min_bbox_area_px: 0
  reject_if_bbox_outside_frame: false
  max_bbox_outside_ratio: 1.0
  blur:
    enabled: false
    min_score: 80.0
size_estimation:
  enabled: true
  type: temporal_bbox_short_side
  metric: min_dimension
  zone: {x_min_ratio: 0.0, x_max_ratio: 1.0, y_min_ratio: 0.70, y_max_ratio: 0.82}
  required_samples: 1
  min_detection_confidence: 0.50
  reject_if_touches_frame_edge: true
  frame_edge_margin_px: 2
  thresholds:
    small_max_px: 150
    medium_max_px: 250
  labels:
    small: Small
    medium: Medium
    large: Large
visualization:
  enabled: true
  draw_classification_zone: true
  classification_zone: {x_min_ratio: 0.0, x_max_ratio: 1.0, y_min_ratio: 0.4114583333, y_max_ratio: 1.0}
  classification_zone_color: [255, 190, 0]
  draw_size_measurement_zone: true
  size_measurement_zone: {x_min_ratio: 0.0, x_max_ratio: 1.0, y_min_ratio: 0.70, y_max_ratio: 0.82}
  size_measurement_zone_color: [255, 220, 0]
  line_thickness: 4
  font_scale: 0.48
  font_thickness: 1
  draw_track_id: true
  draw_detection_confidence: false
  draw_health: false
  draw_calyx: true
  draw_size: true
  show_pending_status: true
  pending_label: PENDING
  calyx_star_radius_px: 40
  sidebar: {enabled: true, width_px: 380, title: TOMATO SORTING, max_rows: 14}
  colors:
    healthy:
    - 0
    - 200
    - 0
    unhealthy:
    - 0
    - 0
    - 255
    pending:
    - 0
    - 200
    - 255
logging:
  level: INFO
  include_bbox_history: true
  include_quality_gate_failures: true
  include_track_latency: true
  json_indent: 2
benchmark:
  enabled: true
  warmup_frames: 10
  report_percentiles:
  - 50
  - 90
  - 95
  - 99
